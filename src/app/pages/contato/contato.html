<div class="container my-5">
  <div class="text-center mb-5">
    <h1 class="display-4 fw-bold">Entre em Contato</h1>
    <p class="lead text-muted">Estamos aqui para ajudar. Conecte-se conosco!</p>
  </div>

  <div class="row g-4 justify-content-center">
    
    <div class="col-lg-5">
      <div class="card h-100 shadow-sm">
        <div class="card-body p-4">
          <h3 class="card-title mb-4">Nossos Canais</h3>
          <ul class="list-group list-group-flush">
            <li class="list-group-item d-flex align-items-center py-3">
              <strong class="me-3">Telefone:</strong> 0800 703 3673
            </li>
            <li class="list-group-item d-flex align-items-center py-3">
             
              <strong class="me-3">E-mail:</strong> central&#64;ford.com
            </li>
            <li class="list-group-item d-flex align-items-center py-3">
              <strong class="me-3">Sede:</strong> Av. Dr. Cardoso de Melo, 1336, São Paulo/SP
            </li>
          </ul>
        </div>
      </div>
    </div>

    
    <div class="col-lg-5">
      <div class="card h-100 shadow-sm">
        <div class="card-body p-4">
          <h3 class="card-title mb-4">Siga-nos nas Redes Sociais</h3>
          <div class="d-grid gap-3">
            <a [href]="facebookUrl" target="_blank" class="btn btn-outline-primary btn-lg d-flex align-items-center justify-content-center">Facebook</a>
            <a [href]="youtubeUrl" target="_blank" class="btn btn-outline-danger btn-lg d-flex align-items-center justify-content-center">YouTube</a>
            <a [href]="instagramUrl" target="_blank" class="btn btn-outline-warning btn-lg d-flex align-items-center justify-content-center">Instagram</a>
            <a [href]="tiktokUrl" target="_blank" class="btn btn-outline-dark btn-lg d-flex align-items-center justify-content-center">TikTok</a>
            <a [href]="linkedinUrl" target="_blank" class="btn btn-outline-info btn-lg d-flex align-items-center justify-content-center">LinkedIn</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
